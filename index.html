
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Crypt Slasher</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { background-color: #0c0a12; color: #fff; font-family: monospace; overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #gameContainer { position: relative; width: 100%; max-width: 800px; height: 60vh; max-height: 450px; background-color: #141122; border: 4px solid #3d2f5a; }
        canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; }
        .hp-bar-container { width: 120px; height: 15px; background: #441111; border: 2px solid #fff; }
        #hpBar { width: 100%; height: 100%; background: #ff2244; }
        #controls { width: 100%; max-width: 800px; height: 35vh; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #0f0d1a; }
        .btn-group { display: flex; gap: 15px; }
        .btn { width: 75px; height: 75px; background: #251e3e; border: 3px solid #5a4b87; border-radius: 50%; color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; }
        .btn:active { transform: scale(0.95); background: #3d3266; }
        #btnSlash { width: 90px; height: 90px; background: #831843; border-color: #db2777; font-size: 16px; font-weight: bold; }
        #btnSlash:active { background: #be185d; }
        #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 10, 18, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 15px; z-index: 10; }
        #btnRestart { padding: 10px 20px; background: #059669; border: 2px solid #fff; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="640" height="360"></canvas>
        <div id="ui">
            <div>HP <div class="hp-bar-container"><div id="hpBar"></div></div></div>
            <div id="scoreLabel">SCORE: 0</div>
        </div>
        <div id="gameOverScreen">
            <h1>GAME OVER</h1>
            <p id="finalScore">SCORE: 0</p>
            <button id="btnRestart" onclick="resetGame()">Cuba Lagi</button>
        </div>
    </div>

    <div id="controls">
        <div class="btn-group">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btnJump">▲</div>
            <div class="btn" id="btnSlash">SLASH</div>
        </div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

let gameActive = true, score = 0, enemies = [], particles = [];
const gravity = 0.5, groundY = 290;
const keys = { left: false, right: false };

const player = { x: 80, y: 200, width: 24, height: 36, vx: 0, vy: 0, speed: 4, jumpForce: -10, grounded: false, facing: "right", hp: 100, isSlashing: false, slashTimer: 0 };

document.getElementById("btnLeft").addEventListener("touchstart", (e) => { e.preventDefault(); keys.left = true; });
document.getElementById("btnLeft").addEventListener("touchend", (e) => { e.preventDefault(); keys.left = false; });
document.getElementById("btnRight").addEventListener("touchstart", (e) => { e.preventDefault(); keys.right = true; });
document.getElementById("btnRight").addEventListener("touchend", (e) => { e.preventDefault(); keys.right = false; });
document.getElementById("btnJump").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (player.grounded && gameActive) { player.vy = player.jumpForce; player.grounded = false; }
});
document.getElementById("btnSlash").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (!player.isSlashing && gameActive) { player.isSlashing = true; player.slashTimer = 10; checkSlashAttack(); }
});

function spawnEnemy() {
    if (!gameActive) return;
    enemies.push({ x: canvas.width + 20, y: groundY - 24, width: 24, height: 24, speed: 1.5 + Math.random() * 1.5 });
    setTimeout(spawnEnemy, 1500 + Math.random() * 2000);
}

function checkSlashAttack() {
    let lx = player.facing === "right" ? player.x + player.width : player.x - 40;
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        if (lx < e.x + e.width && lx + 40 > e.x && player.y < e.y + e.height && player.y + player.height > e.y) {
            for (let p = 0; p < 8; p++) particles.push({ x: e.x + 12, y: e.y + 12, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, size: 3, life: 15, color: "#ec4899" });
            enemies.splice(i, 1);
            score += 10;
            document.getElementById("scoreLabel").innerText = "SCORE: " + score;
        }
    }
}

function update() {
    if (!gameActive) return;
    player.vx = keys.left ? -player.speed : (keys.right ? player.speed : 0);
    if (keys.left) player.facing = "left";
    if (keys.right) player.facing = "right";

    player.vy += gravity; player.x += player.vx; player.y += player.vy;
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    if (player.y + player.height >= groundY) { player.y = groundY - player.height; player.vy = 0; player.grounded = true; }

    if (player.isSlashing) { player.slashTimer--; if (player.slashTimer <= 0) player.isSlashing = false; }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i]; e.x -= e.speed;
        if (e.x < player.x + player.width && e.x + e.width > player.x && e.y < player.y + player.height && e.y + e.height > player.y) {
            player.hp -= 2;
            document.getElementById("hpBar").style.width = Math.max(0, player.hp) + "%";
            if (player.hp <= 0) { gameActive = false; document.getElementById("finalScore").innerText = "MARKAH AKHIR: " + score; document.getElementById("gameOverScreen").style.display = "flex"; }
        }
        if (e.x + e.width < 0) enemies.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) particles.splice(i, 1); }
}

function draw() {
    ctx.fillStyle = "#141122"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#2d2444"; ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    ctx.fillStyle = "#3b82f6"; ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = "#f3f4f6"; ctx.fillRect(player.facing === "right" ? player.x + 12 : player.x + 4, player.y + 4, 8, 8);

    if (player.isSlashing) {
        ctx.fillStyle = "#f472b6"; ctx.shadowColor = "#db2777"; ctx.shadowBlur = 10;
        ctx.fillRect(player.facing === "right" ? player.x + player.width + 4 : player.x - 36, player.y + 6, 32, player.height - 12);
        ctx.shadowBlur = 0;
    }
    enemies.forEach(e => { ctx.fillStyle = "#059669"; ctx.fillRect(e.x, e.y, e.width, e.height); ctx.fillStyle = "#ef4444"; ctx.fillRect(e.x + 4, e.y + 4, 4, 4); ctx.fillRect(e.x + 14, e.y + 4, 4, 4); });
    particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
function resetGame() { player.hp = 100; player.x = 80; player.y = 200; player.vx = 0; player.vy = 0; score = 0; enemies = []; particles = []; gameActive = true; document.getElementById("hpBar").style.width = "100%"; document.getElementById("scoreLabel").innerText = "SCORE: 0"; document.getElementById("gameOverScreen").style.display = "none"; }

spawnEnemy();
loop();
</script>
</body>
</html>
